[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minivigpt"
version = "0.2.0"
description = "Educational reproducible Vietnamese decoder-only language model trained from scratch"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.3,<3",
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "datasets>=3.0,<5",
  "tokenizers>=0.20,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
